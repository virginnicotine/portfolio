<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Timing tool</title>
<style>body{background:#050505;color:#eee;font:14px system-ui,sans-serif;max-width:760px;margin:0 auto;padding:24px}textarea{width:100%;height:160px;background:#111;color:#eee;border:1px solid #333;border-radius:8px;padding:10px;font:inherit}button{background:#ddd;border:0;padding:10px 16px;margin:6px 6px 6px 0;border-radius:8px;font-weight:600;cursor:pointer}#cur{font-size:1.6rem;margin:16px 0;min-height:2.4em}pre{background:#111;padding:12px;white-space:pre-wrap;border:1px solid #333;border-radius:8px}.m{color:#888}</style></head><body>
<h2>Timing tool</h2>
<p class="m">1) Choose the mp3. 2) Paste your lines, one per row. 3) Press Start, then Space (or the Tap button) at the moment each line begins. Press D at the drop. 4) Copy the result into INTRO in index.html.</p>
<input type="file" id="f" accept="audio/*"><audio id="a" controls style="width:100%;margin:10px 0"></audio>
<textarea id="t" placeholder="one line of text per row"></textarea>
<div><button id="go">Start / reset</button><button id="tp">Tap: next line (Space)</button><button id="dr">Mark DROP (D)</button><button id="cp">Copy result</button></div>
<div id="cur" class="m">-</div><pre id="out"></pre>
<script>
const $=i=>document.getElementById(i),a=$("a");let L=[],i=0,R=[],drop=null;
$("f").onchange=e=>{a.src=URL.createObjectURL(e.target.files[0])};
function render(){$("out").textContent="drop: "+(drop===null?"?":drop.toFixed(2))+",\nlines: [\n"+R.map(r=>"  { t: "+r.t.toFixed(2)+", text: "+JSON.stringify(r.text)+" }").join(",\n")+"\n]";$("cur").textContent=i<L.length?"Next: "+L[i]:"All lines timed"}
$("go").onclick=()=>{L=$("t").value.split("\n").map(s=>s.trim()).filter(Boolean);i=0;R=[];drop=null;a.currentTime=0;a.play();render()};
function tap(){if(i<L.length){R.push({t:a.currentTime,text:L[i]});i++;render()}}
function mark(){drop=a.currentTime;render()}
$("tp").onclick=tap;$("dr").onclick=mark;
$("cp").onclick=()=>navigator.clipboard&&navigator.clipboard.writeText($("out").textContent);
addEventListener("keydown",e=>{if(e.target.tagName==="TEXTAREA")return;if(e.code==="Space"){e.preventDefault();tap()}if(e.code==="KeyD")mark()});
</script></body></html>
